name: release

# Publica una versión firmada al empujar un tag vX.Y.Z:
#   git tag v0.6.0 && git push origin v0.6.0
# Los APK quedan con nombre fijo, así este enlace siempre apunta a la última versión:
#   https://github.com/DavidCevallos15/david-launcher-tv/releases/latest/download/david-launcher-tv.apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta la llave de firma. Ejecuta una vez scripts/setup-releases.ps1 en tu PC (ver docs/RELEASES.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Compilar APK firmados
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :remote:assembleRelease

      - name: Preparar archivos
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/david-launcher-tv.apk
          cp remote/build/outputs/apk/release/remote-release.apk dist/tv-remote.apk
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          # Falla si por error salió firmado con la llave de debug
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in *.apk; do
            "$SIGNER" verify --print-certs "$apk" | tee /dev/stderr | grep -q "CN=Android Debug" && { echo "::error::$apk firmado con debug"; exit 1; } || true
          done

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Instalar
          - **En el TV:** abre la app *Downloader* y escribe \`davidcevallos15.github.io/david-launcher-tv/tv\`
          - **En el celular (control remoto):** escanea el QR en https://davidcevallos15.github.io/david-launcher-tv/

          Guía completa: [docs/INSTALLATION.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/INSTALLATION.md)

          Firmado con la llave estable del proyecto: las próximas versiones se instalan encima sin desinstalar.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --latest
          fi
